<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel 💖</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#ffd6e7,#dff8ff);
padding:30px;
}

h1{
text-align:center;
color:#ff5f95;
margin-bottom:25px;
}

#stats{
text-align:center;
margin-bottom:25px;
font-size:18px;
color:#666;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(330px,1fr));
gap:25px;
}

.card{
background:white;
padding:22px;
border-radius:20px;
box-shadow:0 12px 30px rgba(0,0,0,.12);
}

.cert{
border:3px dashed #ff5f95;
padding:18px;
border-radius:15px;
background:#fff0f5;
text-align:center;
}

.cert h2{
color:#ff5f95;
margin:8px 0;
}

.cert hr{
margin:15px 0;
border:none;
border-top:1px solid #ffb8d0;
}

.msg{
margin-top:18px;
background:white;
padding:12px;
border-radius:10px;
border-left:5px solid #ff5f95;
word-break:break-word;
}

.time{
margin-top:12px;
font-size:.85rem;
color:#777;
text-align:right;
}

.empty{
text-align:center;
color:#777;
font-size:18px;
margin-top:60px;
}
</style>
</head>

<body>

<h1>💖 Friendship Admin Panel</h1>

<div id="stats">Loading...</div>

<div id="cards" class="grid"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAGg5ZHQHcTLfggRwlRr98TwqCDelpYHjs",
  authDomain: "fryends-777.firebaseapp.com",
  databaseURL: "https://fryends-777-default-rtdb.firebaseio.com",
  projectId: "fryends-777",
  storageBucket: "fryends-777.firebasestorage.app",
  messagingSenderId: "196473923423",
  appId: "1:196473923423:web:30c4102ee221f6a07078ea",
  measurementId: "G-BCYQJSEBHW"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const cards=document.getElementById("cards");
const stats=document.getElementById("stats");

onValue(ref(db,"friends"),snapshot=>{

cards.innerHTML="";

if(!snapshot.exists()){
stats.textContent="0 Friends";
cards.innerHTML='<div class="empty">No certificates yet 🥲</div>';
return;
}

const data=snapshot.val();

const arr=Object.values(data);

stats.innerHTML=`<b>${arr.length}</b> Friend${arr.length==1?"":"s"} 💖`;

arr.sort((a,b)=>b.time-a.time);

arr.forEach(friend=>{

const date=new Date(friend.time).toLocaleString();

cards.innerHTML+=`

<div class="card">

<div class="cert">

<h3>📜 Friendship Certificate</h3>

<p>This certifies</p>

<h2>${friend.name}</h2>

<p>is officially my friend 💖</p>

<hr>

<p><b>Date Joined</b></p>

<p>${date}</p>

</div>

<div class="msg">
<b>💌 Message:</b><br><br>
${friend.message || "<i>No message left.</i>"}
</div>

<div class="time">
Device Joined: ${date}
</div>

</div>

`;

});

});

</script>

</body>
</html>
